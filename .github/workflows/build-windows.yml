name: Build Windows

on:
  push:
    branches:
      - build-windows
    # Release tags pushed by script/release.
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref, so a `make windows` run can't cancel a release build.
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_windows_x86_64:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Use the stable channel for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: Set-Content -Path crates/zed/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh

      - name: Set release version
        run: |
          $version = & script/get-crate-version.ps1 zed
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Bundle Windows installer
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Ded-windows-x86_64
          path: target/Ded-x86_64.exe
          if-no-files-found: error
